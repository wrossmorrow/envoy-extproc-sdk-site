version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/wrossmorrow/envoy-extproc-sdk-site/gen/go
plugins:
  # Go (matches your go.mod / go tool plugins)
  - remote: buf.build/protocolbuffers/go:v1.36.5
    out: gen/go
    opt: paths=source_relative
  - remote: buf.build/grpc/go:v1.5.1
    out: gen/go
    opt: paths=source_relative
  - remote: buf.build/connectrpc/go:v1.18.1
    out: gen/go
    opt: paths=source_relative

  # Rust (prost 0.14 + tonic 0.14 / tonic-prost 0.14, flat output -> controller.v1.rs)
  - remote: buf.build/community/neoeinstein-prost:v0.5.0
    out: gen/rust
    opt:
      - flat_output_dir
      - type_attribute=.=#[allow(clippy::all)]
  - remote: buf.build/community/neoeinstein-tonic:v0.5.0
    out: gen/rust
    opt:
      - flat_output_dir

  # Java (protobuf 3.21.x compatible + grpc-java)
  - remote: buf.build/protocolbuffers/java:v21.12
    out: gen/java
  - remote: buf.build/grpc/java:v1.68.1
    out: gen/java
