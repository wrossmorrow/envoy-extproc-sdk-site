version: v2
managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/wrossmorrow/envoy-extproc-sdk-site/gen/go
plugins:
  - local: ["go", "tool", "protoc-gen-go"]
    out: gen/go
    opt: paths=source_relative
  - local: ["go", "tool", "protoc-gen-go-grpc"]
    out: gen/go
    opt: paths=source_relative
  - local: ["go", "tool", "protoc-gen-connect-go"]
    out: gen/go
    opt: paths=source_relative
  - local: ["protoc-gen-tonic-prost"]
    out: gen/rust
  # envoy ext_proc controller service -> java gRPC client/server code
  - local: ["protoc-gen-grpc-java"]
    out: gen/java
  # envoy ext_proc controller messages -> java protobuf messages. The envoy ext_proc SDK (and the
  # envoy gencode it ships) are built against protobuf 3.x, so the Java generator must run with a
  # protobuf 3.x protoc binary (e.g. 3.21.x); protoc_path points at the protoc binary on PATH.
  - protoc_builtin: java
    out: gen/java
    protoc_path: protoc
