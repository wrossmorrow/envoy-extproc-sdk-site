name: Java PR Checks
on:
  pull_request:
    paths:
      - 'java/**'
      - 'gen/java/**'
      - 'Dockerfile.java'

jobs:
  java-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Spotless check and unit tests
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd java/demo-extproc
          ./gradlew --no-daemon spotlessCheck test

  java-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Check Java image build
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          docker build \
            --build-arg GITHUB_ACTOR="${GITHUB_ACTOR}" \
            --secret id=github_token,env=GITHUB_TOKEN \
            -f Dockerfile.java .
