name: Pull Request Checks
on:
  pull_request:
    paths:
      - '**/*.go'
jobs:
  build-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: Check build(s)
        run: |
          go build -o /dev/null ./...
          (cd examples && go build -o /dev/null ./...)
          (cd test && go build -o /dev/null ./...)
      # test/Dockerfile is covered by the integration job, but o/w examples/Dockerfile not covered
      - name: Check example image build
        run: docker build -f examples/Dockerfile -t extproc-examples:ci .
  vet-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: Vet the main library
        run: |
          go install golang.org/x/tools/go/analysis/passes/shadow/cmd/shadow@latest
          go vet -vettool=$(go env GOPATH)/bin/shadow ./...
  unit-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: Unit tests
        run: go test -v -race ./...
