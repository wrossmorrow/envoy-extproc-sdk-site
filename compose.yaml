services:

  # envoy, configured as with envoy.yaml to use the demo extproc
  envoy:
    image: envoyproxy/envoy:${ENVOY_VERSION:-v1.35-latest}
    command: ["envoy", "-c", "/etc/envoy/envoy.yaml", "--log-level", "info"]
    ports:
      - "8080:8000"
      - "9901:9901"
    volumes:
      - ./envoy.yaml:/etc/envoy/envoy.yaml
    depends_on:
      - echo
      - demo
    networks:
      - demo

  # upstream "echo" server
  echo:
    image: ghcr.io/wrossmorrow/simple-echo-server:${ECHO_VERSION:-main}
    command:
      - -port=8000
      - -name=demo
    ports:
      - "8005:8000"
    networks:
      - demo

  # controller service
  controller:
    image: ghcr.io/wrossmorrow/envoy-extproc-sdk-site-controller:${CONTROLLER_VERSION:-local}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        CMD: controller
    ports:
      - "9093:9093"
      - "9092:9092"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-check-certificate -q -O /dev/null http://localhost:9092/healthz || exit 1"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 3s
    networks:
      - demo

  # demo extproc (minimal M1: request headers phase interception)
  demo:
    image: ghcr.io/wrossmorrow/envoy-extproc-sdk-site-demo:${DEMO_VERSION:-local}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        CMD: demo
    ports:
      - "50051:50051"
      - "9094:9090"
    healthcheck:
      test: ["CMD", "/grpc-health-probe", "-addr=localhost:50051"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 3s
    networks:
      - demo

networks:
  demo: {}
