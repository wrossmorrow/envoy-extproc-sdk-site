services:

  # envoy, configured as with envoy.yaml to use the extproc
  envoy:
    image: envoyproxy/envoy:${ENVOY_VERSION:-v1.40-latest}
    command: ["envoy", "-c", "/etc/envoy/envoy.yaml", "--log-level", "info"]
    ports:
      - "8081:8000"
      - "9901:9901"
    volumes:
      - ./envoy.yaml:/etc/envoy/envoy.yaml
    depends_on:
      - upstream
      - extproc
    networks:
      - default
      - demo

  # upstream "echo" server
  upstream:
    image: ghcr.io/wrossmorrow/simple-echo-server:${ECHO_VERSION:-main}
    command:
      - -port=8000
      - -name=envoy-extproc-sdk-demo-upstream
    networks:
      - demo

  # controller service
  controller:
    image: ghcr.io/wrossmorrow/envoy-extproc-sdk-site-controller:${CONTROLLER_VERSION:-local}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        CMD: controller
    healthcheck:
      test: ["CMD-SHELL", "wget --no-check-certificate -q -O /dev/null http://localhost:9092/healthz || exit 1"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 3s
    networks:
      - demo

  # static asset server for the interactive demo frontend
  web:
    image: ghcr.io/wrossmorrow/envoy-extproc-sdk-site-web:${WEB_VERSION:-local}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        CMD: web
    healthcheck:
      test: ["CMD-SHELL", "wget --no-check-certificate -q -O /dev/null http://localhost:8000/ || exit 1"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 3s
    networks:
      - demo

  # extproc, integrated with envoy and holds requests for interactive handling
  extproc:
    image: ghcr.io/wrossmorrow/envoy-extproc-sdk-site-extproc:${EXTPROC_VERSION:-local}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        CMD: extproc
    healthcheck:
      test: ["CMD", "/grpc-health-probe", "-addr=localhost:50051"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 3s
    networks:
      - demo

  # extproc (Rust implementation), integrated with envoy and holds requests for interactive handling
  extproc-rust:
    image: ghcr.io/wrossmorrow/envoy-extproc-sdk-site-extproc-rust:${EXTPROC_RUST_VERSION:-local}
    build:
      context: .
      dockerfile: Dockerfile.rust
    healthcheck:
      test: ["CMD", "/grpc-health-probe", "-addr=localhost:50051"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 3s
    networks:
      - demo

  # extproc (Java implementation), integrated with envoy and holds requests for interactive handling
  extproc-java:
    image: ghcr.io/wrossmorrow/envoy-extproc-sdk-site-extproc-java:${EXTPROC_JAVA_VERSION:-local}
    build:
      context: .
      dockerfile: Dockerfile.java
      args:
        GITHUB_ACTOR: ${GITHUB_ACTOR:-}
      secrets:
        - github_token
    healthcheck:
      test: ["CMD", "/grpc-health-probe", "-addr=localhost:50051"]
      interval: 2s
      timeout: 2s
      retries: 15
      start_period: 3s
    networks:
      - demo

secrets:
  github_token:
    environment: GITHUB_TOKEN

networks:
  demo:
    internal: true
