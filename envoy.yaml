admin:
  address:
    socket_address:
      address: 0.0.0.0
      port_value: 9901
overload_manager:
  resource_monitors:
    - name: envoy.resource_monitors.global_downstream_max_connections
      typed_config:
        "@type": type.googleapis.com/envoy.extensions.resource_monitors.downstream_connections.v3.DownstreamConnectionsConfig
        max_active_downstream_connections: 2048
static_resources:
  listeners:
    - name: listener
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 8000
      per_connection_buffer_limit_bytes: 65536
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: envoy
                codec_type: AUTO
                access_log:
                  - name: envoy.access_loggers.stdout
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.access_loggers.stream.v3.StdoutAccessLog
                      log_format:
                        text_format_source:
                          inline_string: "[%START_TIME%] \"%REQ(:METHOD)% %REQ(X-ENVOY-ORIGINAL-PATH?:PATH)% %PROTOCOL%\" %RESPONSE_CODE% %RESPONSE_FLAGS% %BYTES_RECEIVED% %BYTES_SENT% %DURATION%ms cluster=%UPSTREAM_CLUSTER% lang=%REQ(X-DEMO-TARGET-LANG)% session=%REQ(X-DEMO-SESSION-ID)%\n"
                route_config:
                  name: local_route
                  virtual_hosts:
                    - name: canonical_redirect
                      domains:
                        - "envoy-extproc-sdk.com"
                        - "envoy-extproc-sdk.com:*"
                        - "envoy-extproc-sdk.org"
                        - "envoy-extproc-sdk.org:*"
                        - "envoy-extproc-sdk.dev"
                        - "envoy-extproc-sdk.dev:*"
                      routes:
                        - match:
                            prefix: "/"
                          redirect:
                            host_redirect: "envoy-extproc-sdk.app"
                            https_redirect: true
                            response_code: PERMANENT_REDIRECT
                          typed_per_filter_config:
                            envoy.filters.http.ext_proc:
                              "@type": type.googleapis.com/envoy.extensions.filters.http.ext_proc.v3.ExtProcPerRoute
                              disabled: true
                    - name: upstream
                      domains: ["*"]
                      routes:

                        # Connect HTTP RPCs and long-lived server-streaming
                        # (CreateSession / SubmitDecision) -> controller:9092,
                        # bypassing ext_proc so streaming frames are not buffered.
                        - name: controller-connect
                          match:
                            prefix: "/controller.v1.DemoControllerService/"
                          route:
                            cluster: controller-http
                            timeout: 0s
                            idle_timeout: 0s
                          typed_per_filter_config:
                            envoy.filters.http.ext_proc:
                              "@type": type.googleapis.com/envoy.extensions.filters.http.ext_proc.v3.ExtProcPerRoute
                              disabled: true

                        # Browser UI static assets -> web:8000, bypassing ext_proc.
                        - name: web-assets
                          match:
                            safe_regex:
                              regex: "^/(index\\.html|how\\.html|og\\.png|style\\.css|app\\.js|favicon\\.ico)$"
                            headers:
                              - name: "x-demo-session-id"
                                present_match: false
                          route:
                            cluster: web
                          typed_per_filter_config:
                            envoy.filters.http.ext_proc:
                              "@type": type.googleapis.com/envoy.extensions.filters.http.ext_proc.v3.ExtProcPerRoute
                              disabled: true

                        # Document load on "/" -> web:8000, bypassing ext_proc. Any GET or
                        # HEAD without a demo session id is a page load: browsers, but also
                        # link-preview crawlers (Slack, LinkedIn), which don't reliably send
                        # Accept: text/html and sometimes probe with HEAD. Demo requests
                        # always carry x-demo-session-id and fall through to ext_proc below.
                        - name: web-root
                          match:
                            path: "/"
                            headers:
                              - name: ":method"
                                string_match:
                                  safe_regex:
                                    regex: "^(GET|HEAD)$"
                              - name: "x-demo-session-id"
                                present_match: false
                          route:
                            cluster: web
                          typed_per_filter_config:
                            envoy.filters.http.ext_proc:
                              "@type": type.googleapis.com/envoy.extensions.filters.http.ext_proc.v3.ExtProcPerRoute
                              disabled: true

                        # Route to the go demo extproc when the request carries
                        # `x-demo-target-lang: go`. Requests without the header (or
                        # with any other value) fall through to the default route
                        # below, which uses the Go demo extproc.
                        - name: extproc-go
                          match:
                            prefix: "/"
                            headers:
                              - name: x-demo-target-lang
                                string_match:
                                  exact: go
                              - name: x-demo-session-id
                                present_match: true
                          route:
                            cluster: upstream
                          typed_per_filter_config:
                            envoy.filters.http.ext_proc:
                              "@type": type.googleapis.com/envoy.extensions.filters.http.ext_proc.v3.ExtProcPerRoute
                              overrides:
                                grpc_service:
                                  envoy_grpc:
                                    cluster_name: extproc
                                failure_mode_allow: false
                                processing_mode:
                                  request_header_mode: SEND
                                  response_header_mode: SEND
                                  request_body_mode: BUFFERED
                                  response_body_mode: BUFFERED
                                  request_trailer_mode: SKIP
                                  response_trailer_mode: SKIP

                        # Direct API calls: route to the Rust demo extproc when the
                        # request carries `x-demo-target-lang: rust`. Requests without
                        # the header (or with any other value) fall through to the
                        # default route below, which uses the Go demo extproc.
                        - name: extproc-rust
                          match:
                            prefix: "/"
                            headers:
                              - name: x-demo-target-lang
                                string_match:
                                  exact: rust
                              - name: x-demo-session-id
                                present_match: true
                          route:
                            cluster: upstream
                          typed_per_filter_config:
                            envoy.filters.http.ext_proc:
                              "@type": type.googleapis.com/envoy.extensions.filters.http.ext_proc.v3.ExtProcPerRoute
                              overrides:
                                grpc_service:
                                  envoy_grpc:
                                    cluster_name: extproc-rust
                                failure_mode_allow: false
                                processing_mode:
                                  request_header_mode: SEND
                                  response_header_mode: SEND
                                  request_body_mode: BUFFERED
                                  response_body_mode: BUFFERED
                                  request_trailer_mode: SKIP
                                  response_trailer_mode: SKIP
                        
                        # Route to the Java demo extproc when the request carries
                        # `x-demo-target-lang: java`. Requests without the header (or
                        # with any other value) fall through to the default route
                        # below, which uses the Go demo extproc.
                        - name: extproc-java
                          match:
                            prefix: "/"
                            headers:
                              - name: x-demo-target-lang
                                string_match:
                                  exact: java
                              - name: x-demo-session-id
                                present_match: true
                          route:
                            cluster: upstream
                          typed_per_filter_config:
                            envoy.filters.http.ext_proc:
                              "@type": type.googleapis.com/envoy.extensions.filters.http.ext_proc.v3.ExtProcPerRoute
                              overrides:
                                grpc_service:
                                  envoy_grpc:
                                    cluster_name: extproc-java
                                failure_mode_allow: false
                                processing_mode:
                                  request_header_mode: SEND
                                  response_header_mode: SEND
                                  request_body_mode: BUFFERED
                                  response_body_mode: BUFFERED
                                  request_trailer_mode: SKIP
                                  response_trailer_mode: SKIP
                        
                        # Default demo target: no x-demo-target-lang header (or any
                        # language without a more specific route) -> golang extproc.
                        - name: extproc-default
                          match:
                            prefix: "/"
                            headers:
                              - name: x-demo-session-id
                                present_match: true
                          route:
                            cluster: upstream

                        # Catch-all for unmatched requests (e.g., internet scanners probing
                        # /.env, /wp-config.php, etc. without x-demo-session-id) so they
                        # never hit ext_proc, controller, or upstream.
                        - name: not-found
                          match:
                            prefix: "/"
                          direct_response:
                            status: 404
                            body:
                              inline_string: "not found\n"
                          typed_per_filter_config:
                            envoy.filters.http.ext_proc:
                              "@type": type.googleapis.com/envoy.extensions.filters.http.ext_proc.v3.ExtProcPerRoute
                              disabled: true
                    
                http_filters:
                  - name: envoy.filters.http.local_ratelimit
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.local_ratelimit.v3.LocalRateLimit
                      stat_prefix: http_local_rate_limiter
                      token_bucket:
                        max_tokens: 500
                        tokens_per_fill: 100
                        fill_interval: 1s
                      filter_enabled:
                        runtime_key: local_rate_limit_enabled
                        default_value:
                          numerator: 100
                          denominator: HUNDRED
                      filter_enforced:
                        runtime_key: local_rate_limit_enforced
                        default_value:
                          numerator: 100
                          denominator: HUNDRED
                      response_headers_to_add:
                        - append_action: OVERWRITE_IF_EXISTS_OR_ADD
                          header:
                            key: x-local-rate-limit
                            value: "true"
                  - name: envoy.filters.http.ext_proc
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.ext_proc.v3.ExternalProcessor
                      grpc_service:
                        envoy_grpc:
                          cluster_name: extproc
                        timeout: 30s
                      failure_mode_allow: false
                      message_timeout: 60s
                      processing_mode:
                        request_header_mode: SEND
                        response_header_mode: SEND
                        request_body_mode: BUFFERED
                        response_body_mode: BUFFERED
                        request_trailer_mode: SKIP
                        response_trailer_mode: SKIP
                  - name: envoy.filters.http.router
                    typed_config:
                      '@type': type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
  clusters:
  - name: upstream
    connect_timeout: 0.250s
    type: LOGICAL_DNS
    lb_policy: LEAST_REQUEST
    dns_lookup_family: V4_ONLY
    load_assignment:
      cluster_name: upstream
      endpoints:
        - lb_endpoints:
            - endpoint:
                hostname: upstream
                address:
                  socket_address:
                    address: upstream
                    port_value: 8000
  - name: web
    connect_timeout: 0.250s
    type: LOGICAL_DNS
    lb_policy: ROUND_ROBIN
    dns_lookup_family: V4_ONLY
    load_assignment:
      cluster_name: web
      endpoints:
        - lb_endpoints:
            - endpoint:
                hostname: web
                address:
                  socket_address:
                    address: web
                    port_value: 8000
  - name: controller-http
    connect_timeout: 0.250s
    type: LOGICAL_DNS
    lb_policy: ROUND_ROBIN
    dns_lookup_family: V4_ONLY
    load_assignment:
      cluster_name: controller-http
      endpoints:
        - lb_endpoints:
            - endpoint:
                hostname: controller
                address:
                  socket_address:
                    address: controller
                    port_value: 9092
  - name: controller
    dns_lookup_family: V4_ONLY
    lb_policy: ROUND_ROBIN
    load_assignment:
      cluster_name: controller
      endpoints:
        - lb_endpoints:
            - endpoint:
                hostname: controller
                address:
                  socket_address:
                    address: controller
                    port_value: 9093
    type: LOGICAL_DNS
    typed_extension_protocol_options:
      envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
        '@type': type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
        explicit_http_config:
          http2_protocol_options: {}
  - name: extproc
    dns_lookup_family: V4_ONLY
    lb_policy: ROUND_ROBIN
    load_assignment:
      cluster_name: extproc
      endpoints:
        - lb_endpoints:
            - endpoint:
                hostname: extproc
                address:
                  socket_address:
                    address: extproc
                    port_value: 50051
    type: LOGICAL_DNS
    typed_extension_protocol_options:
      envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
        '@type': type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
        explicit_http_config:
          http2_protocol_options: {}
  - name: extproc-rust
    dns_lookup_family: V4_ONLY
    lb_policy: ROUND_ROBIN
    load_assignment:
      cluster_name: extproc-rust
      endpoints:
        - lb_endpoints:
            - endpoint:
                hostname: extproc-rust
                address:
                  socket_address:
                    address: extproc-rust
                    port_value: 50051
    type: LOGICAL_DNS
    typed_extension_protocol_options:
      envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
        '@type': type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
        explicit_http_config:
          http2_protocol_options: {}
  - name: extproc-java
    dns_lookup_family: V4_ONLY
    lb_policy: ROUND_ROBIN
    load_assignment:
      cluster_name: extproc-java
      endpoints:
        - lb_endpoints:
            - endpoint:
                hostname: extproc-java
                address:
                  socket_address:
                    address: extproc-java
                    port_value: 50051
    type: LOGICAL_DNS
    typed_extension_protocol_options:
      envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
        '@type': type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
        explicit_http_config:
          http2_protocol_options: {}
