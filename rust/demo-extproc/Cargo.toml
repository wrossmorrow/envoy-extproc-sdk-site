[package]
name = "demo-extproc"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
description = "Envoy extproc demo processor (Rust) for the envoy-extproc-sdk-site demo."
license = "Apache-2.0"

[lib]
name = "demo_extproc"
path = "src/lib.rs"

[[bin]]
name = "demo-extproc"
path = "src/main.rs"

[dependencies]
envoy_extproc_sdk = { package = "envoy_extproc_sdk", version = "0.4.0" }
envoy-types = "0.7.7"
prost = "0.14"
prost-types = "0.14"
tonic-prost = "0.14"
tokio = { version = "1", features = ["full"] }
tokio-stream = "0.1"
tonic = { version = "0.14", features = ["server", "transport", "codegen"] }
async-trait = "0.1"

[workspace]
