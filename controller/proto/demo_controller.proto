syntax = "proto3";

package demo.controller.v1;

option go_package = "github.com/wrossmorrow/envoy-extproc-sdk-controller/demo/controller/v1";

// DemoController manages interactive extproc sessions for the demo site.
service DemoController {
  // CreateSession creates a new session and opens a stream of updates. The
  // first Update carries the session id with phase NOT_STARTED; the browser
  // then sends the envoy-bound request carrying that session id and receives
  // phase updates as the session resolves.
  rpc CreateSession (CreateSessionRequest) returns (stream Update);

  // UpdateRequest submits a human decision (continue/cancel) for a session at a phase.
  rpc SubmitDecision (UpdateRequest) returns (UpdateResponse);

  // Process carries the extproc<->controller channel as a bidi stream: the
  // extproc initiates on request receipt and sends phase updates, the
  // controller sends decisions back.
  rpc Process (stream Update) returns (stream UpdateRequest);
}

message CreateSessionRequest {}

message Update {
  string session_id = 1;
  Phase phase = 2;
}

message UpdateRequest {
  string session_id = 1;
  Phase phase = 2;
  Decision decision = 3;
}

message Decision {
  oneof action {
    Continue continue = 1;
    Cancel cancel = 2;
  }
}

message Continue {
  // header/body mutations to apply when continuing.
  map<string, string> headers = 1;
}

message Cancel {
  int32 status = 1;
  string body = 2;
  map<string, string> headers = 3;
}

message UpdateResponse {}

enum Phase {
  NOT_STARTED = 0;
  REQUEST_HEADERS = 1;
  REQUEST_BODY = 2;
  REQUEST_TRAILERS = 3;
  RESPONSE_HEADERS = 4;
  RESPONSE_BODY = 5;
  RESPONSE_TRAILERS = 6;
}
