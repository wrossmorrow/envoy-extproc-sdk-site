syntax = "proto3";

package demo.controller.v1;

option go_package = "github.com/wrossmorrow/envoy-extproc-sdk-controller/demo/controller/v1";

// DemoController manages interactive extproc sessions for the demo site.
service DemoController {
  // CreateSession creates a new session and returns its id.
  rpc CreateSession (CreateSessionRequest) returns (CreateSessionResponse);

  // GetUpdates opens a server-side-streaming channel of updates for a session.
  rpc GetUpdates (GetUpdatesRequest) returns (stream Update);

  // UpdateRequest submits a human decision (continue/cancel) for a session at a phase.
  rpc SubmitDecision (UpdateRequest) returns (UpdateResponse);
}

message CreateSessionRequest {}
message CreateSessionResponse { string session_id = 1; }

message GetUpdatesRequest { string session_id = 1; }

message Update {
  string session_id = 1;
  int32 phase = 2;
}

message UpdateRequest {
  string session_id = 1;
  int32 phase = 2;
  Decision decision = 3;
}

message Decision {
  oneof action {
    Continue continue = 1;
    Cancel cancel = 2;
  }
}

message Continue {
  // header/body mutations to apply when continuing.
  map<string, string> headers = 1;
}

message Cancel {
  int32 status = 1;
  string body = 2;
}

message UpdateResponse {}
