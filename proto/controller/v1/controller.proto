syntax = "proto3";

package controller.v1;

import "google/protobuf/timestamp.proto";

// DemoControllerService manages interactive extproc sessions for the demo site.
service DemoControllerService {
  // CreateSession creates a new session (or resumes an existing one when
  // session_id is set and still active) and opens a stream of updates. The
  // first Update carries the session id with phase PHASE_UNSPECIFIED (or the
  // currently paused phase/snapshot/deadline when resuming mid-flight).
  rpc CreateSession(CreateSessionRequest) returns (stream CreateSessionResponse);

  // SubmitDecision submits a human decision (continue/cancel) for a session at a phase.
  rpc SubmitDecision(SubmitDecisionRequest) returns (SubmitDecisionResponse);

  // CancelSession explicitly terminates an active session, failing closed any
  // in-flight phase and releasing session state.
  rpc CancelSession(CancelSessionRequest) returns (CancelSessionResponse);
}

// DemoProcessorService is the internal controller<->extproc channel service. It is
// not part of the human-facing surface; it exists for the demo's extproc to
// exchange phase updates and decisions with the controller.
service DemoProcessorService {
  // Process carries the extproc<->controller channel as a bidi stream: the
  // extproc initiates on request receipt and sends phase updates, the controller
  // sends decisions back.
  rpc Process(stream ProcessRequest) returns (stream ProcessResponse);
}

message CreateSessionRequest {
  // Optional existing session_id to resume on reconnect. When empty/unset, a
  // new session is created. When set to an unknown or expired session,
  // CreateSession returns NotFound.
  optional string session_id = 1;
}

message CancelSessionRequest {
  string session_id = 1;
}

message CancelSessionResponse {}

message CreateSessionResponse {
  string session_id = 1;
  Phase phase = 2;
  HttpSnapshot snapshot = 3;
  google.protobuf.Timestamp deadline = 4;
}

message SubmitDecisionRequest {
  string session_id = 1;
  Phase phase = 2;
  Decision decision = 3;
}

message SubmitDecisionResponse {}

message ProcessRequest {
  string session_id = 1;
  Phase phase = 2;
  HttpSnapshot snapshot = 3;
}

message ProcessResponse {
  string session_id = 1;
  Phase phase = 2;
  Decision decision = 3;
}

message Decision {
  oneof action {
    Continue continue = 1;
    Cancel cancel = 2;
  }
}

message Continue {
  // header/body mutations to apply when continuing.
  map<string, string> headers = 1;
  repeated string remove_headers = 2;
  optional bytes body = 3;
}

message Header {
  string key = 1;
  string value = 2;
}

message HttpSnapshot {
  // Headers observed at this phase; keeps order and duplicates; includes
  // :method, :path and friends. Empty for phases that carry no headers.
  repeated Header headers = 1;
  // Body observed at this phase; body phases only; capped (e.g. 16 KiB).
  bytes body = 2;
  // True when the body was truncated at the cap above.
  bool body_truncated = 3;
  // Response status observed at this phase; response phases only.
  int32 status = 4;
}

message Cancel {
  int32 status = 1;
  string body = 2;
  map<string, string> headers = 3;
}

enum Phase {
  // PHASE_UNSPECIFIED is the pre-phase slot: the session is waiting for the
  // envoy-bound request to enter its first phase. Real phases are numbered to
  // align with envoy's ext_proc phase values (1 = REQUEST_HEADERS, ..., 6 =
  // RESPONSE_TRAILERS).
  PHASE_UNSPECIFIED = 0;
  PHASE_REQUEST_HEADERS = 1;
  PHASE_REQUEST_BODY = 2;
  PHASE_REQUEST_TRAILERS = 3;
  PHASE_RESPONSE_HEADERS = 4;
  PHASE_RESPONSE_BODY = 5;
  PHASE_RESPONSE_TRAILERS = 6;
}
